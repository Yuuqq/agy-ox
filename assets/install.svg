<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="228" viewBox="0 0 880 228" role="img" aria-label="Install agy-ox in four steps: open a workspace, add marketplace Yuuqq/agy-ox, install the plugin, then type $agy-ox">
  <title>Install agy-ox in four steps</title>
  <rect width="880" height="228" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="16" y="16" width="191" height="196" rx="16" fill="#FFFFFF" stroke="#D1FAE5"/>
    <circle cx="44" cy="46" r="15" fill="#0D9488"/>
    <text x="44" y="51" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#ECFDF5">1</text>
    <text x="34" y="86" font-size="16" font-weight="700" fill="#0F172A">Open workspace</text>
    <text x="34" y="114" font-size="13" fill="#64748B">Any project folder</text>
    <text x="34" y="134" font-size="13" fill="#64748B">in ZCode first</text>
    <rect x="34" y="160" width="155" height="32" rx="8" fill="#ECFDF5"/>
    <text x="111" y="181" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0F766E">open a workspace</text>

    <path d="M215 114 L227 114 L227 108 L243 118 L227 128 L227 122 L215 122 Z" fill="#0D9488"/>

    <rect x="235" y="16" width="191" height="196" rx="16" fill="#FFFFFF" stroke="#D1FAE5"/>
    <circle cx="263" cy="46" r="15" fill="#0D9488"/>
    <text x="263" y="51" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#ECFDF5">2</text>
    <text x="253" y="86" font-size="16" font-weight="700" fill="#0F172A">Add marketplace</text>
    <text x="253" y="114" font-size="13" fill="#64748B">Plugins / Discover / +</text>
    <text x="253" y="134" font-size="13" fill="#64748B">paste the source</text>
    <rect x="253" y="160" width="155" height="32" rx="8" fill="#111827"/>
    <text x="330" y="181" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#5EEAD4">Yuuqq/agy-ox</text>

    <path d="M434 114 L446 114 L446 108 L462 118 L446 128 L446 122 L434 122 Z" fill="#0D9488"/>

    <rect x="454" y="16" width="191" height="196" rx="16" fill="#FFFFFF" stroke="#D1FAE5"/>
    <circle cx="482" cy="46" r="15" fill="#0D9488"/>
    <text x="482" y="51" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#ECFDF5">3</text>
    <text x="472" y="86" font-size="16" font-weight="700" fill="#0F172A">Get / Install</text>
    <text x="472" y="114" font-size="13" fill="#64748B">Install the plugin</text>
    <text x="472" y="134" font-size="13" fill="#64748B">enabled by default</text>
    <rect x="472" y="160" width="155" height="32" rx="8" fill="#ECFDF5"/>
    <text x="549" y="181" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0F766E">plugin: agy-ox</text>

    <path d="M653 114 L665 114 L665 108 L681 118 L665 128 L665 122 L653 122 Z" fill="#D97706"/>

    <rect x="673" y="16" width="191" height="196" rx="16" fill="#FFFFFF" stroke="#FDE68A"/>
    <circle cx="701" cy="46" r="15" fill="#D97706"/>
    <text x="701" y="51" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#FFFBEB">4</text>
    <text x="691" y="86" font-size="16" font-weight="700" fill="#0F172A">Type in chat</text>
    <text x="691" y="114" font-size="13" fill="#64748B">Start a task with</text>
    <text x="691" y="134" font-size="13" fill="#64748B">either invocation</text>
    <rect x="691" y="160" width="155" height="32" rx="8" fill="#111827"/>
    <text x="768" y="181" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#FDE68A">$agy-ox  /agy-ox</text>
  </g>
</svg>

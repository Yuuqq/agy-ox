<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="ZCode delegates a task through $agy-ox to official agy -p, then checks JSON status, error, and response">
  <title>How agy-ox runs</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0D9488"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="24" y="36" width="250" height="208" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="44" y="68" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0D9488" letter-spacing="1">ZCODE</text>
  <text x="44" y="96" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#0F172A">Chat</text>
  <rect x="44" y="116" width="210" height="44" rx="10" fill="#ECFDF5" stroke="#99F6E4"/>
  <text x="58" y="144" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0F766E">$agy-ox</text>
  <text x="44" y="188" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#64748B">review this diff</text>
  <text x="44" y="212" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#64748B">or implement the fix</text>

  <line x1="286" y1="140" x2="338" y2="140" stroke="#0D9488" stroke-width="2.4" marker-end="url(#arr)"/>

  <rect x="350" y="36" width="270" height="208" rx="14" fill="#111827"/>
  <text x="370" y="68" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#5EEAD4">agy -p</text>
  <text x="370" y="108" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#E2E8F0">--output-format json</text>
  <text x="370" y="136" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#FDE68A">--mode plan</text>
  <text x="370" y="156" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#94A3B8">read-only</text>
  <text x="370" y="188" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#6EE7B7">--mode accept-edits</text>
  <text x="370" y="208" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#94A3B8">write files</text>

  <line x1="632" y1="140" x2="684" y2="140" stroke="#0D9488" stroke-width="2.4" marker-end="url(#arr)"/>

  <rect x="696" y="36" width="240" height="208" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="716" y="68" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#D97706" letter-spacing="1">CHECK ALL FOUR</text>
  <text x="716" y="108" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#0F172A">1. exit code</text>
  <text x="716" y="136" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#0F172A">2. status</text>
  <text x="716" y="164" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#0F172A">3. error</text>
  <text x="716" y="192" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#0F172A">4. response</text>
  <text x="716" y="224" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#64748B">SUCCESS only if 1+2 pass</text>
</svg>

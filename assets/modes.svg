<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="228" viewBox="0 0 880 228" role="img" aria-label="plan mode for read-only work, accept-edits mode for file writes; run_command still follows permissions">
  <title>Official --mode split</title>
  <rect width="880" height="228" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="16" y="16" width="416" height="196" rx="16" fill="#FFFFFF" stroke="#99F6E4"/>
    <text x="40" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#0F766E">--mode plan</text>
    <text x="40" y="86" font-size="18" font-weight="700" fill="#0F172A">Read-only worker</text>
    <text x="40" y="118" font-size="14" fill="#475569">Research / review / explain</text>
    <text x="40" y="142" font-size="14" fill="#475569">agy looks around, then writes a plan</text>
    <rect x="40" y="164" width="368" height="32" rx="8" fill="#ECFDF5"/>
    <text x="224" y="185" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0F766E">use unless the user asked to edit files</text>

    <rect x="448" y="16" width="416" height="196" rx="16" fill="#FFFFFF" stroke="#FDE68A"/>
    <text x="472" y="52" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#B45309">--mode accept-edits</text>
    <text x="472" y="86" font-size="18" font-weight="700" fill="#0F172A">Write files</text>
    <text x="472" y="118" font-size="14" fill="#475569">Implement / fix / generate files</text>
    <text x="472" y="142" font-size="14" fill="#475569">Workspace writes are auto-approved</text>
    <rect x="472" y="164" width="368" height="32" rx="8" fill="#FFFBEB"/>
    <text x="656" y="185" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#B45309">run_command still needs Permissions</text>
  </g>
</svg>
